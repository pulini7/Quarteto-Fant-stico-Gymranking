<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quarteto Fantástico Gymranking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              brand: {
                dark: '#0f172a',
                card: '#1e293b',
                primary: '#ec4899', // Pink 500
                accent: '#d946ef',  // Fuchsia 500
                danger: '#ef4444'
              }
            },
            padding: {
                'safe': 'env(safe-area-inset-bottom)'
            },
            animation: {
                'pop-like': 'pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'spin-slow': 'spin 3s linear infinite',
            },
            keyframes: {
                pop: {
                    '0%': { transform: 'scale(1)' },
                    '50%': { transform: 'scale(1.5)' },
                    '100%': { transform: 'scale(1)' },
                },
                'pulse-glow': {
                    '0%, 100%': { opacity: '1', boxShadow: '0 0 10px rgba(236, 72, 153, 0.5)' },
                    '50%': { opacity: '0.8', boxShadow: '0 0 20px rgba(236, 72, 153, 0.8)' },
                }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior-y: none; /* Previne efeito elástico indesejado */
      }
      
      /* Utilitário para Safe Area do iPhone */
      .pb-safe {
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Previne zoom em inputs no iOS */
      input, textarea, select {
        font-size: 16px !important; 
      }
      
      /* Scrollbar escondida mas funcional */
      .scrollbar-hide::-webkit-scrollbar {
          display: none;
      }
      .scrollbar-hide {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }

      /* Loader Customizado Moderno */
      .gym-loader {
        width: 48px;
        height: 48px;
        border: 4px solid #1e293b;
        border-bottom-color: #ec4899;
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
        position: relative;
      }
      .gym-loader::after {
        content: '';  
        box-sizing: border-box;
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid transparent;
        border-bottom-color: #d946ef;
      }
    
      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.3"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
